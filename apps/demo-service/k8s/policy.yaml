# Default-deny NetworkPolicy for apps-demo — used by Scenario B to simulate DB failure.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: apps-demo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-traffic
  namespace: apps-demo
spec:
  podSelector:
    matchLabels:
      tier: demo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
        - port: 5432
        - port: 6379