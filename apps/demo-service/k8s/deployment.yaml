apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: apps-demo
  labels: { app: checkout, tier: demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
      annotations:
        instrumentation.opentelemetry.io/inject: "true"
    spec:
      containers:
        - name: checkout
          image: demo-service:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: checkout }
            - { name: APP_VERSION,       value: "v1" }
            - { name: LATENCY_PROFILE,   value: fast }
            - { name: ERROR_RATE,        value: "0" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
