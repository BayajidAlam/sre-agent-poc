<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Athena — SRE Agent · Demo Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Athena — SRE Agent <span class="muted">· Demo Control</span></h1>
    <div class="header-right">
      <span id="netpolicy-pill" class="pill pill-grey" title="NetworkPolicy block-db in apps-demo">np: ?</span>
      <span id="task-pill" class="pill pill-grey" title="current agent task">task: idle</span>
      <span class="muted small" id="last-poll">—</span>
    </div>
  </header>

  <section class="actions">
    <button id="btn-inject-regression" class="btn btn-warn" title="Roll payment out as v2 with slow latency and 50% errors, then let the agents auto-fix it back to v1">
      Inject + Auto-fix: payment v2 (slow + 50% errors)
    </button>
    <button id="btn-inject-db" class="btn btn-warn" title="Apply NetworkPolicy that breaks egress to postgres/redis, then let the agents try to fix it (policy is expected to DENY)">
      Inject + Auto-fix: DB egress block
    </button>
    <button id="btn-fix" class="btn btn-primary" title="Re-run the agent fix for the current degraded service (no inject)">
      Trigger Agent Fix (no inject)
    </button>
    <button id="btn-reset" class="btn btn-ghost" title="Roll all services back to v1 and delete the NetworkPolicy">
      Reset all to v1
    </button>
  </section>

  <section>
    <h2>Services (live)</h2>
    <table id="services">
      <thead>
        <tr>
          <th>Service</th>
          <th>Status</th>
          <th>Version</th>
          <th>Profile</th>
          <th>Err rate</th>
          <th>Replicas</th>
          <th>Image</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="7" class="muted center">loading…</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <div class="section-header">
      <h2>Agent activity</h2>
      <button id="btn-clear-logs" class="btn btn-tiny btn-ghost" title="Empty the in-memory event ring buffer (server-side)">Clear log</button>
    </div>
    <div class="task-summary" id="task-summary">No agent task in flight.</div>
    <ol id="events" class="events"></ol>
  </section>

  <script src="app.js"></script>
</body>
</html>
