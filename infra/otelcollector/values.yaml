# OpenTelemetry Collector — receives OTLP from apps and exports to Tempo (traces),
# Prometheus (metrics via the prometheus exporter), and Loki (logs).
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
  # Chart's appVersion is 0.161.0; pin a slightly older but matching contrib tag.
  tag: 0.161.0

# Disable the chart's built-in presets that auto-inject receivers + rename exporters.
presets:
  logsCollection:
    enabled: false

config:
  exporters:
    # Traces -> Tempo (OTLP gRPC). The chart renamed the `otlp` exporter to
    # `otlp_grpc` (and auto-rewrites for one release); use the new name.
    otlp_grpc:
      endpoint: tempo.observability:4317
      tls: { insecure: true }
    # Metrics -> exposed on :8889 for Prometheus to scrape. The `prometheus`
    # exporter maps OTLP cumulative/Delta metrics to Prometheus exposition
    # format. Combined with the OTel HTTP server auto-instrumentation on
    # demo-service, this populates http_server_duration_seconds_bucket and
    # http_server_duration_seconds_count so the SRE POC overview dashboard
    # actually has data.
    prometheus:
      endpoint: 0.0.0.0:8889
      # Re-emit the OTel resource attributes as Prometheus labels so we can
      # filter by service_name in PromQL.
      resource_to_telemetry_conversion:
        enabled: true
    # NOTE: Logs are NOT routed through the OTel collector in this POC.
    # The `otel/opentelemetry-collector-contrib:0.161.0` image we pin does
    # not bundle the `loki` exporter, and shipping another contrib image
    # for one log pipeline isn't worth the bytes. Instead, the Loki chart's
    # bundled Promtail already scrapes /var/log/containers/*.log from every
    # pod, parses them with the `docker:` pipeline, and forwards to Loki
    # with labels like {namespace, pod, container, app}. The SRE POC
    # overview dashboard's log panel queries Loki directly via those
    # labels.
  processors:
    batch:
      timeout: 5s
    memory_limiter:
      limit_mib: 512
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus]

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# Expose the prometheus exporter on a Service port so the Prometheus
# additionalScrapeConfigs in infra/prometheus/values.yaml (which targets
# otel-collector.observability:8889) can resolve. Without this, the chart
# only opens OTLP/jaeger/zipkin ports on the Service, so DNS resolves but
# the port isn't bound and Prometheus gets connection-refused.
ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    hostPort: 8889
    protocol: TCP

service:
  type: ClusterIP