# kind cluster config for sre-poc
# Exposes container ports for the observability stack so the user can browse Grafana/Tempo/Loki.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-poc
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000      # Grafana (legacy; blocked on Win when VS Code owns 127.0.0.1:3000)
        protocol: TCP
      - containerPort: 30001
        hostPort: 3100      # Loki (legacy; blocked by wslrelay)
        protocol: TCP
      - containerPort: 30002
        hostPort: 3200      # Tempo (legacy; blocked by wslrelay)
        protocol: TCP
      - containerPort: 30003
        hostPort: 9090      # Prometheus (legacy; blocked by wslrelay)
        protocol: TCP
      # High-port mappings used by manifests/ui-nodeports.yaml so UIs are reachable from
      # Windows hosts even when 3000/3100/3200/9090 are squatted by VS Code / wslrelay.
      - containerPort: 30010
        hostPort: 13000     # Grafana (via ui-grafana NodePort service)
        protocol: TCP
      - containerPort: 30011
        hostPort: 19090     # Prometheus (via ui-prometheus)
        protocol: TCP
      - containerPort: 30012
        hostPort: 19093     # Alertmanager (via ui-alertmanager)
        protocol: TCP
      - containerPort: 30013
        hostPort: 13100     # Loki (via ui-loki)
        protocol: TCP
      - containerPort: 30014
        hostPort: 13200     # Tempo (via ui-tempo)
        protocol: TCP
      - containerPort: 30020
        hostPort: 19443     # Kubernetes Dashboard (via kubernetes-dashboard-np)
        protocol: TCP
  - role: worker
  - role: worker