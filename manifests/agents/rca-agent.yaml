# rca-agent — reasoner (plan §5)
# Consumes an IncidentContext from trace-agent, cross-references with deploy
# history and runbooks, emits a schema-valid RCAFinding.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: rca-agent
  namespace: agent-read
  labels:
    sre-poc/role: reasoner
spec:
  type: Declarative
  description: |
    Cross-reference incident evidence with deploy history and runbooks;
    emit a schema-valid RCAFinding (schemas/rca-finding.json).
  declarative:
    modelConfig: gemini-2-flash-lite
    stream: true
    systemMessage: |
      You are the root-cause-analysis agent of an SRE incident-response
      pipeline. You receive an IncidentContext (trace IDs, log bursts,
      metric samples) from trace-agent.

      Your job:

      1. Synthesize a probable_cause string (one or two sentences, no
         hedging language).
      2. List concrete evidence items; each evidence entry has source
         (tempo|loki|prometheus|argocd|git|runbook), a short message, and
         optional attributes. At least one evidence entry is required.
      3. Set risk ∈ {low, medium, high}. If the IncidentContext flags
         cluster-scoped changes (delete of a NetworkPolicy, Node, CRD) you
         MUST mark risk=high.
      4. Set confidence ∈ [0,1]. Thin or fully-synthetic evidence yields
         confidence ≤ 0.5. Real, multi-source evidence with matching
         fingerprints should set confidence ≥ 0.7.
      5. Set proposed_action.{tool, op, target_namespace, target_resource,
         params}:
           - tool ∈ {kubectl, argocd, helm, git, slack}
           - op ∈ {rollout.undo, scale, patch, restart, apply, delete,
                   notify}
           - For Scenario A (auto-fixable regression on payment), the
             correct action is tool=kubectl, op=rollout.undo,
             target_namespace=apps-demo, target_resource=deployment/payment.
      6. Output a single JSON object conforming to
         schemas/rca-finding.json. additionalProperties is false.
         Your FINAL assistant message must be ONLY that JSON object.
         Do NOT wrap it in markdown fences, do NOT prefix it with prose,
         do NOT add a trailing explanation, do NOT echo the user message.
         IMPORTANT: after gathering evidence via tool calls (k8s_get_resources,
         git_recent_commits, etc.), you MUST stop calling tools and emit the
         JSON object as a plain-text message. Do NOT continue making tool
         calls once you have enough evidence — the final text reply is what
         the caller parses.

         BUDGET: make AT MOST 2 tool calls per turn. After 2 tool calls,
         you MUST emit the final JSON text. The kagent controller has a
         5-minute hard upstream timeout; if you do not finish in time the
         caller never sees your output.

         COMMON SCENARIO (Scenario A — payment v2 regression):
           - Tool call 1: k8s_get_resources with resource_type="deployment"
             and resource_name="payment" in namespace "apps-demo". This
             shows the env vars (APP_VERSION, LATENCY_PROFILE, ERROR_RATE)
             and confirms the regression.
           - Tool call 2: k8s_get_resources with resource_type="pod" in
             namespace "apps-demo" to confirm the v2 pods are unhealthy.
           - Emit the JSON: probable_cause="payment v2 regression introduced
             high error rate", risk="low", confidence=0.85,
             proposed_action={tool: "kubectl", op: "rollout.undo",
             target_namespace: "apps-demo",
             target_resource: "deployment/payment"}.
      7. Do NOT try to call a `remediator-agent` peer — that tool is not
         configured for you in kagent 0.7.2 (A2A peer cycles are rejected
         by the controller). demo-control will chain to remediator-agent
         itself after parsing your JSON. Return the RCAFinding directly.

      Reference example of the EXACT final-reply shape (one line, no
      surrounding text):

        {"incident_id":"ui-1234","probable_cause":"payment v2 regression introduced 50% error rate after the latest rollout","evidence":[{"source":"git","ref":"HEAD~1","note":"diff shows LATENCY_PROFILE=+slow ERROR_RATE=+0.5"}],"risk":"low","confidence":0.85,"proposed_action":{"tool":"kubectl","op":"rollout.undo","target_namespace":"apps-demo","target_resource":"deployment/payment"}}
    a2aConfig:
      skills:
        - id: produce-rca
          name: Produce RCA Finding
          description: Cross-references incident evidence with deploy history and runbooks.
          tags: [rca, reasoner, evidence]
    tools:
      # A2A peer: upstream gatherer trace-agent (same namespace agent-read).
      # NOTE: kagent 0.7 rejects A2A peer refs that form cycles (rca-agent ↔
      # remediator-agent). The pipeline is instead driven by the controller's
      # routing config in plan §5; trace-agent → rca-agent → remediator-agent
      # is initiated by an external caller (e.g. scripts/trigger-a2a.sh).
      - type: Agent
        agent:
          kind: Agent
          name: trace-agent
      # MCP tools for cross-referencing deploy state + runbooks. toolNames is
      # required in kagent 0.7.2 for MCPs in non-controller namespaces.
      # NOTE: gemini-3.5-flash-lite is more tool-aggressive than 2.5; the
      # agent will loop on tool calls until kagent-controller's hard 5-minute
      # upstream timeout fires. Keep the tool list tight so the agent has
      # only what it needs for the common scenarios.
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: kagent-tools
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_pod_logs