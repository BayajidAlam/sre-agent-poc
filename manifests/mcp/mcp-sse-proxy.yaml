apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sse-proxy
  namespace: kagent
  labels:
    app: mcp-sse-proxy
    sre-poc/component: mcp-sse-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-sse-proxy
  template:
    metadata:
      labels:
        app: mcp-sse-proxy
    spec:
      containers:
        - name: mcp-sse-proxy
          image: mcp-sse-proxy:dev
          imagePullPolicy: Never
          env:
            - name: UPSTREAM_URL
              value: "http://kagent-tools.kagent.svc.cluster.local:8084"
            - name: PROXY_PORT
              value: "8084"
          ports:
            - containerPort: 8084
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-sse-proxy
  namespace: kagent
spec:
  selector:
    app: mcp-sse-proxy
  ports:
    - name: http
      port: 8084
      targetPort: 8084