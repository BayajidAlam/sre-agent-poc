apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: loki-mcp
  namespace: agent-read
  labels:
    sre-poc/component: mcp-shim
spec:
  description: "Loki MCP — LogQL queries against the Loki stack"
  protocol: STREAMABLE_HTTP
  url: http://loki-mcp.agent-read.svc.cluster.local:80/mcp
  timeout: 10s