# policy-mcp — wraps OPA. Exposes `evaluate(RemediationAction) -> {allow, reason}`.
# Lives in agent-write ns so it's only reachable from the remediator-agent.
# This is the plain Deployment + Service (no MCPServer CR — kagent uses RemoteMCPServer
# pointing at this service).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-mcp
  namespace: agent-write
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-mcp
  namespace: agent-write
  labels: { app: policy-mcp }
spec:
  replicas: 1
  selector: { matchLabels: { app: policy-mcp } }
  template:
    metadata:
      labels: { app: policy-mcp }
    spec:
      serviceAccountName: policy-mcp
      containers:
        - name: policy-mcp
          image: policy-mcp:dev        # built locally; loaded into kind by bootstrap
          ports:
            - { containerPort: 8080 }
          env:
            - { name: OPA_URL, value: "http://opa.agent-write.svc.cluster.local:8181" }
            - { name: OPA_POLICY_PATH, value: "/v1/data/sre/remediation/allow" }
            - { name: POLICY_TIMEOUT_MS, value: "2000" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: policy-mcp
  namespace: agent-write
spec:
  selector: { app: policy-mcp }
  ports:
    - { port: 80, targetPort: 8080, protocol: TCP }