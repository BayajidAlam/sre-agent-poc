apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-bridge
  namespace: agent-read
  labels:
    app: alert-bridge
    sre-poc/component: webhook-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-bridge
  template:
    metadata:
      labels:
        app: alert-bridge
    spec:
      containers:
        - name: alert-bridge
          image: alert-bridge:dev
          imagePullPolicy: Never
          env:
            - name: RCA_AGENT_URL
              value: "http://rca-agent.agent-read.svc.cluster.local:8080/"
            - name: TRACE_AGENT_URL
              value: "http://trace-agent.agent-read.svc.cluster.local:8080/"
            - name: REMEDIATOR_AGENT_URL
              value: "http://remediator-agent.agent-read.svc.cluster.local:8080/"
          ports:
            - containerPort: 9094
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9094
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9094
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alert-bridge
  namespace: agent-read
spec:
  selector:
    app: alert-bridge
  ports:
    - name: http
      port: 9094
      targetPort: 9094