# ModelConfig — Google Gemini 2.5 Flash-Lite (free tier).
# The bound trace-controller picks this up by name when an Agent CR references it
# via spec.declarative.modelConfig (or spec.modelConfig on v1alpha1).
#
# The Gemini API key is NOT in this file. It must be supplied via:
#   kubectl -n kagent create secret generic kagent-gemini \
#     --from-literal=GOOGLE_API_KEY="$GOOGLE_API_KEY"
# (install-kagent-controller.sh does this idempotently.)
#
# The bound trace-controller pod reads the secret via apiKeySecret /
# apiKeySecretKey and exposes GOOGLE_API_KEY to its runtime; agent pods inherit.
#
# Free tier limits (per https://ai.google.dev/gemini-api/docs/rate-limits):
#   - 15 RPM  (1 request every 4 seconds)
#   - 1M TPM
#   - 1500 RPD (~500 full chain runs/day; each chain = 3 requests)
#
# Model history:
#   - 2026-10: gemini-2.0-flash returned 404 NOT_FOUND (retired by Google);
#     reverted to gemini-2.5-flash-lite which was the model that worked
#     before the free-tier quota exhaustion.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: gemini-2-flash-lite
  namespace: kagent
  labels:
    sre-poc/component: llm-provider
spec:
  provider: Gemini
  model: gemini-3.5-flash-lite
  apiKeySecret: kagent-gemini
  apiKeySecretKey: GOOGLE_API_KEY