apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: agent-read
  labels:
    app: argocd-mcp
    sre-poc/component: mcp-shim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      containers:
        - name: argocd-mcp
          image: argocd-mcp:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5