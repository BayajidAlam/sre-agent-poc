apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slack-recorder-data
  namespace: agent-read
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-recorder
  namespace: agent-read
  labels:
    app: slack-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slack-recorder
  template:
    metadata:
      labels:
        app: slack-recorder
    spec:
      containers:
        - name: slack-recorder
          image: slack-recorder:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slack-recorder-data